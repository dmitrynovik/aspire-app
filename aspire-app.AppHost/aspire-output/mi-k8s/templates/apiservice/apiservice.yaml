---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "apiservice"
  labels:
    app.kubernetes.io/name: "aspire-app"
    app.kubernetes.io/component: "apiservice"
    app.kubernetes.io/instance: "{{.Release.Name}}"
spec:
  type: "LoadBalancer"
  selector:
    app.kubernetes.io/name: "aspire-app"
    app.kubernetes.io/component: "apiservice"
    app.kubernetes.io/instance: "{{.Release.Name}}"
  ports:
    - name: "http"
      protocol: "TCP"
      port: {{ .Values.parameters.apiservice.port_http }}
      targetPort: {{ .Values.parameters.apiservice.port_http }}
    - name: "https"
      protocol: "TCP"
      port: {{ .Values.parameters.apiservice.port_https }}
      targetPort: {{ .Values.parameters.apiservice.port_https }}
