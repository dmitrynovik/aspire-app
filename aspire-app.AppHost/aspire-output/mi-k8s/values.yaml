parameters:
  apiservice:
    port_http: "8080"
    port_https: "8080"
    apiservice_image: "apiservice:latest"
  webfrontend:
    port_http: "8080"
    port_https: "8080"
    webfrontend_image: "webfrontend:latest"
secrets: {}
config:
  apiservice:
    OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
    OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
    OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  webfrontend:
    OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
    OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
    OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  gateway:
    ASPNETCORE_ENVIRONMENT: "Production"
    REVERSEPROXY__ROUTES__route0__MATCH__PATH: "/{**catchall}"
    REVERSEPROXY__ROUTES__route0__CLUSTERID: "cluster_webfrontend"
    REVERSEPROXY__ROUTES__route1__MATCH__PATH: "/api/{**catch-all}"
    REVERSEPROXY__ROUTES__route1__CLUSTERID: "cluster_apiservice"
    REVERSEPROXY__ROUTES__route1__TRANSFORMS__0__PathRemovePrefix: "/api"
    REVERSEPROXY__CLUSTERS__cluster_webfrontend__DESTINATIONS__destination1__ADDRESS: "https+http://webfrontend"
    REVERSEPROXY__CLUSTERS__cluster_apiservice__DESTINATIONS__destination1__ADDRESS: "https+http://apiservice"
