config:
    gateway:
        services__apiservice__https__0: "https://apiservice:443"
        services__apiservice__http__0:  "http://apiservice:5000"
        services__webfrontend__https__0: "https://webfrontend:443"
        services__webfrontend__http__0:  "http://webfrontend:5000"
    apiservice:
        HTTP_PORTS: "5000"
        ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    webfrontend:
        HTTP_PORTS: "5000"
        ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
parameters:
  apiservice:
    port_http: "5000"
    port_https: "5001"
  webfrontend:
    port_http: "5000"
    port_https: "5001"
